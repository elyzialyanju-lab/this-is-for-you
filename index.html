<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special for My Bubub Imo 💖</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fbcfe8 0%, #f472b6 50%, #e879f9 100%);
            min-height: 100vh;
        }
        .font-fredoka {
            font-family: 'Fredoka', cursive;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.6);
        }
        /* Floating Animation */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(3deg); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        /* Heart Fall Animation */
        .heart-particle {
            position: fixed;
            top: -10%;
            z-index: 0;
            user-select: none;
            pointer-events: none;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 relative overflow-x-hidden min-h-screen">

    <!-- Container Utama -->
    <div class="w-full max-w-md z-10">

        <!-- HALAMAN 1: WELCOME SCREEN -->
        <div id="page-1" class="glass-card rounded-3xl p-6 text-center shadow-2xl transition-all duration-500 animate-float">
            <div class="text-6xl mb-4">💖✨</div>
            <h1 class="font-fredoka text-3xl font-bold text-pink-600 mb-2">Haloo Bubub Imo! 🥰</h1>
            <p class="text-gray-600 mb-6 text-sm">
                Ada mini quiz khusus buat kamu nih mwehehe. Coba kita tes seberapa paham kamu sama aku! 😜
            </p>
            <button onclick="nextPage(2)" class="w-full bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 active:translate-y-0 transition-all font-fredoka text-lg flex items-center justify-center gap-2">
                <span>Mulai Quiz!</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

        <!-- HALAMAN 2: TEBAK-TEBAKAN SUSU -->
        <div id="page-2" class="glass-card rounded-3xl p-6 shadow-2xl hidden transition-all duration-500">
            <!-- Header Pertanyaan -->
            <div class="text-center mb-6">
                <span class="bg-pink-100 text-pink-600 font-bold px-3 py-1 rounded-full text-xs uppercase tracking-wider">Pertanyaan #1</span>
                <h2 class="font-fredoka text-2xl font-bold text-gray-800 mt-2">
                    Apa susu kesukaan aku? 🥛✨
                </h2>
            </div>

            <!-- Grid 4 Kolom Pilihan -->
            <div class="grid grid-cols-1 gap-3 mb-4">
                
                <!-- Opsi 1 -->
                <button id="opt-1" onclick="checkAnswer(1)" class="w-full p-4 rounded-2xl border-2 border-pink-200 bg-white/70 hover:bg-pink-50 text-gray-700 font-medium text-left transition-all duration-200 flex items-center justify-between group">
                    <span>🥛 Susu Nobo</span>
                    <i class="fa-solid fa-chevron-right text-pink-300 group-hover:text-pink-500 transition-colors"></i>
                </button>

                <!-- Opsi 2 -->
                <button id="opt-2" onclick="checkAnswer(2)" class="w-full p-4 rounded-2xl border-2 border-pink-200 bg-white/70 hover:bg-pink-50 text-gray-700 font-medium text-left transition-all duration-200 flex items-center justify-between group">
                    <span>🍫 Susu Frisian Flag Coklat</span>
                    <i class="fa-solid fa-chevron-right text-pink-300 group-hover:text-pink-500 transition-colors"></i>
                </button>

                <!-- Opsi 3 -->
                <button id="opt-3" onclick="checkAnswer(3)" class="w-full p-4 rounded-2xl border-2 border-pink-200 bg-white/70 hover:bg-pink-50 text-gray-700 font-medium text-left transition-all duration-200 flex items-center justify-between group">
                    <span>🧃 Susu Cimory Coklat</span>
                    <i class="fa-solid fa-chevron-right text-pink-300 group-hover:text-pink-500 transition-colors"></i>
                </button>

                <!-- Opsi 4 (BENAR) -->
                <button id="opt-4" onclick="checkAnswer(4)" class="w-full p-4 rounded-2xl border-2 border-pink-200 bg-white/70 hover:bg-pink-50 text-gray-700 font-medium text-left transition-all duration-200 flex items-center justify-between group">
                    <span>🐒 Susu Monyet</span>
                    <i class="fa-solid fa-chevron-right text-pink-300 group-hover:text-pink-500 transition-colors"></i>
                </button>

            </div>

            <!-- Feedback Message Box -->
            <div id="feedback-box" class="hidden p-4 rounded-2xl text-center font-bold text-sm mb-4 transition-all animate-bounce">
                <p id="feedback-text"></p>
            </div>

            <!-- Tombol Lanjut (Hanya Muncul Pas Benar) -->
            <button id="btn-next" onclick="alert('Ditunggu konsep halaman selanjutnya yaa! 😉')" class="hidden w-full bg-gradient-to-r from-emerald-400 to-green-500 hover:from-emerald-500 hover:to-green-600 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg font-fredoka text-lg flex items-center justify-center gap-2 transition-all">
                <span>Lanjut Pertanyaan Selanjutnya!</span>
                <i class="fa-solid fa-circle-arrow-right"></i>
            </button>
        </div>

    </div>

    <script>
        // Fungsi Pindah Halaman
        function nextPage(pageNumber) {
            document.getElementById('page-1').classList.add('hidden');
            document.getElementById('page-2').classList.remove('hidden');
        }

        // Variable Status Jawaban Benar
        let isSolved = false;

        // Fungsi Cek Jawaban
        function checkAnswer(optionNumber) {
            if (isSolved) return; // Kalau udah bener, ga bisa diklik opsi lain

            const feedbackBox = document.getElementById('feedback-box');
            const feedbackText = document.getElementById('feedback-text');
            const btnNext = document.getElementById('btn-next');

            // Reset warna tombol opsi
            for (let i = 1; i <= 4; i++) {
                const btn = document.getElementById(`opt-${i}`);
                if (i !== optionNumber) {
                    btn.className = "w-full p-4 rounded-2xl border-2 border-pink-200 bg-white/70 text-gray-700 font-medium text-left transition-all duration-200 flex items-center justify-between opacity-50";
                }
            }

            const targetBtn = document.getElementById(`opt-${optionNumber}`);

            if (optionNumber === 1) {
                // Susu Nobo
                targetBtn.className = "w-full p-4 rounded-2xl border-2 border-red-500 bg-red-100 text-red-700 font-bold text-left transition-all duration-200 flex items-center justify-between";
                feedbackBox.className = "p-4 rounded-2xl text-center font-bold text-sm mb-4 bg-red-100 text-red-600 border border-red-300 block";
                feedbackText.innerText = 'ya bener si, TAPI AKU GA SUKA NAMANYA 😜';
            } 
            else if (optionNumber === 2) {
                // Susu Frisian Flag Coklat
                targetBtn.className = "w-full p-4 rounded-2xl border-2 border-red-500 bg-red-100 text-red-700 font-bold text-left transition-all duration-200 flex items-center justify-between";
                feedbackBox.className = "p-4 rounded-2xl text-center font-bold text-sm mb-4 bg-red-100 text-red-600 border border-red-300 block";
                feedbackText.innerText = 'enak enak, tapi ga cocok hm 🧐';
            } 
            else if (optionNumber === 3) {
                // Susu Cimory Coklat
                targetBtn.className = "w-full p-4 rounded-2xl border-2 border-red-500 bg-red-100 text-red-700 font-bold text-left transition-all duration-200 flex items-center justify-between";
                feedbackBox.className = "p-4 rounded-2xl text-center font-bold text-sm mb-4 bg-red-100 text-red-600 border border-red-300 block";
                feedbackText.innerText = 'Eeeee ywdha enak, TAPI GAMAU INI 🙈';
            } 
            else if (optionNumber === 4) {
                // Susu Monyet (BENAR)
                isSolved = true;
                targetBtn.className = "w-full p-4 rounded-2xl border-2 border-emerald-500 bg-emerald-100 text-emerald-800 font-bold text-left transition-all duration-200 flex items-center justify-between shadow-md";
                feedbackBox.className = "p-4 rounded-2xl text-center font-bold text-base mb-4 bg-emerald-100 text-emerald-700 border border-emerald-300 block";
                feedbackText.innerText = 'YOAIII AI LAIK THIS MWEHEHEHHEHEHE🤤🤤🤤🤤😋😋😋😋😋😋😘😘😘😘😘😘😘';
                
                // Tampilkan tombol lanjut
                btnNext.classList.remove('hidden');

                // Efek Love Hujan ekstra pas bener
                for(let i = 0; i < 20; i++) {
                    createHeart();
                }
            }
        }

        // Background Heart Particles
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
            heart.innerHTML = ['💖', '🌸', '✨', '💕', '🥰'][Math.floor(Math.random() * 5)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            heart.style.fontSize = Math.random() * 15 + 15 + 'px';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        setInterval(createHeart, 400);
    </script>
</body>
</html>
